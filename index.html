<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arham's World</title>
<meta name="description" content="Arham's corner of the internet: quantum computing, hardware projects, videos and podcasts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#06050d; --card:#100e1c; --card2:#0b0a15; --line:#24203d; --line2:#332d55;
    --text:#efeeff; --dim:#9591bd; --faint:#6b6794;
    --a:#7c5cff; --b:#22d3ee; --c:#f472d0;
    --head:"Space Grotesk",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;background:var(--bg);color:var(--text);
    font-family:var(--body);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:#7c5cff66}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--b);outline-offset:3px;border-radius:10px}

  /* ---------- background ---------- */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);
  }
  .blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(110px);opacity:.2;z-index:-2;animation:float 22s ease-in-out infinite;pointer-events:none}
  .b1{background:var(--a);top:-18vmax;left:-12vmax}
  .b2{background:var(--b);bottom:-24vmax;right:-14vmax;animation-delay:-7s;opacity:.14}
  .b3{background:var(--c);top:35vh;left:45vw;width:26vmax;height:26vmax;animation-delay:-13s;opacity:.1}
  @keyframes float{50%{transform:translate(5vmax,3vmax) scale(1.12)}}
  #spot{position:fixed;left:0;top:0;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;pointer-events:none;z-index:-1;
    background:radial-gradient(circle,#7c5cff1a,transparent 65%)}

  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    background:#06050db3;border-bottom:1px solid #ffffff0d}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--head);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
  .brand i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:.95rem;color:#fff;
    background:linear-gradient(135deg,var(--b),var(--a) 55%,var(--c))}
  .iconlinks{display:flex;gap:6px}
  .iconlink{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--dim);border:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
  .iconlink:hover{color:var(--text);background:#ffffff0d;border-color:var(--line)}
  .iconlink svg{width:18px;height:18px;fill:currentColor}

  /* ---------- hero ---------- */
  .hero{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center;padding:72px 0 56px}
  .avatar{width:76px;height:76px;border-radius:50%;position:relative;display:grid;place-items:center;margin-bottom:22px}
  .avatar::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,var(--b),var(--a),var(--c),var(--b));animation:spin 6s linear infinite}
  .avatar span{position:absolute;inset:3px;border-radius:50%;background:var(--bg);display:grid;place-items:center;
    font-family:var(--head);font-weight:700;font-size:2rem;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hello{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font-size:.9rem;font-weight:500;
    padding:5px 12px 5px 8px;border:1px solid var(--line);border-radius:99px;background:#ffffff06}
  .hello::before{content:"";width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px #34d39926}
  h1{
    font-family:var(--head);font-size:clamp(2.8rem,8vw,5.2rem);font-weight:700;letter-spacing:-.045em;line-height:1;margin:18px 0 14px;
  }
  h1 .grad{background:linear-gradient(90deg,var(--b),var(--a),var(--c),var(--b));background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
  @keyframes shine{to{background-position:250% 0}}
  .role{font-family:var(--head);font-size:clamp(1.1rem,2.6vw,1.4rem);font-weight:500;color:var(--text);min-height:1.6em}
  .role::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--b);vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .bio{margin-top:16px;color:var(--dim);font-size:1.02rem;line-height:1.7;max-width:58ch}
  .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:600;font-size:.95rem;
    border:1px solid var(--line2);background:#ffffff08;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s}
  .btn svg{width:17px;height:17px;fill:currentColor}
  .btn:hover{transform:translateY(-2px);background:#ffffff12;border-color:#4a4278}
  .btn.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--a),#a855f7 60%,var(--c));box-shadow:0 10px 30px -12px var(--a)}
  .btn.primary:hover{box-shadow:0 16px 40px -12px var(--a)}
  .stats{display:flex;gap:32px;margin-top:36px;padding-top:26px;border-top:1px solid #ffffff0f;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--head);font-size:1.8rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .stat span{color:var(--faint);font-size:.85rem}

  .atomwrap{position:relative;aspect-ratio:1;max-width:400px;width:100%;justify-self:center}
  .atomwrap::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,#7c5cff40,transparent 70%);filter:blur(20px)}
  .atom{position:relative;width:100%;height:100%;overflow:visible;animation:spin 60s linear infinite}
  .atom ellipse{fill:none;stroke-width:1.2}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{font-size:.8rem;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#ffffff06;color:var(--dim)}

  /* ---------- explore ---------- */
  #explore{scroll-margin-top:80px;padding-bottom:40px}
  .bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--b);font-weight:600;margin-bottom:6px}
  h2.title{font-family:var(--head);font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .search{position:relative;width:min(320px,100%)}
  .search svg{position:absolute;left:14px;top:50%;width:16px;height:16px;transform:translateY(-50%);stroke:var(--faint);fill:none;stroke-width:2}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;color:var(--text);
    font:inherit;font-size:.92rem;transition:border-color .2s,background .2s}
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none;border-color:var(--a);background:#7c5cff12}

  .crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px;font-size:.9rem;min-height:0}
  .crumbs:empty{display:none}
  .crumbs button{background:none;border:0;color:var(--dim);cursor:pointer;padding:5px 9px;border-radius:8px;transition:color .2s,background .2s}
  .crumbs button:hover{color:var(--text);background:#ffffff0f}
  .crumbs .back{border:1px solid var(--line);color:var(--text);margin-right:8px}
  .crumbs .sep{color:var(--faint)}
  .crumbs .here{color:var(--text);font-weight:600;padding:5px 6px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .tile{
    --h:258; position:relative;text-align:left;cursor:pointer;text-decoration:none;
    background:linear-gradient(170deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:20px;padding:18px;min-height:156px;overflow:hidden;
    display:flex;flex-direction:column;gap:16px;
    transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;
    animation:pop .5s both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(16px)}}
  .tile::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),hsl(var(--h) 90% 65% / .13),transparent 65%);
  }
  .tile:hover{transform:translateY(-4px);border-color:hsl(var(--h) 90% 65% / .45);box-shadow:0 22px 50px -24px hsl(var(--h) 90% 60% / .7)}
  .tile:hover::after{opacity:1}
  .tile .top{display:flex;justify-content:space-between;align-items:flex-start}
  .badge{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:1.55rem;
    background:hsl(var(--h) 90% 65% / .12);border:1px solid hsl(var(--h) 90% 65% / .22);transition:transform .3s}
  .badge.logo{background:#fff;border-color:#ffffff40;overflow:hidden}
  .badge.logo img{width:190%;height:190%;object-fit:cover;object-position:50% 52%}
  .tile:hover .badge{transform:scale(1.08) rotate(-5deg)}
  .arrow{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.95rem;color:var(--dim);
    border:1px solid var(--line);transition:all .25s}
  .tile:hover .arrow{color:#fff;border-color:transparent;background:hsl(var(--h) 85% 60%)}
  .tile .body{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .tile .name{font-family:var(--head);font-size:1.15rem;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .tile .meta{color:var(--faint);font-size:.84rem;margin-top:3px}
  .cover{margin:-18px -18px 0;aspect-ratio:16/9;background:#000 center/cover no-repeat;position:relative;border-bottom:1px solid var(--line)}
  .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#000a)}
  .cover .play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;
    background:#ffffffe6;color:#111;font-size:1.05rem;padding-left:3px;transform:scale(.9);opacity:.9;transition:transform .25s,opacity .25s}
  .cover.still{background-color:#fff;background-position:center 30%}
  .tile:hover .cover .play{transform:scale(1);opacity:1}
  .cover .count{position:absolute;right:10px;bottom:10px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:#000b;backdrop-filter:blur(4px)}
  .tile.empty{cursor:default;opacity:.6}
  .tile.empty:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .soonpill{font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:99px;color:var(--faint);border:1px dashed var(--line2);white-space:nowrap}
  .crumb-trail{color:var(--faint);font-size:.78rem;margin-bottom:2px}
  .noresults{grid-column:1/-1;text-align:center;color:var(--dim);padding:48px 16px;border:1px dashed var(--line);border-radius:20px}

  .note{margin-top:22px;color:var(--dim);font-size:.9rem;border:1px solid var(--line);background:#ffffff05;border-radius:14px;padding:14px 18px}
  footer{margin-top:64px;border-top:1px solid #ffffff0d}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:24px;padding-bottom:32px;color:var(--faint);font-size:.85rem}
  footer a{text-decoration:none;color:var(--dim)}
  footer a:hover{color:var(--text)}

  /* ---------- slide viewer ---------- */
  .viewer{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:#03020acc;backdrop-filter:blur(12px)}
  .viewer.open{display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .vbox{width:min(1040px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;
    background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line2);border-radius:22px;padding:18px;
    box-shadow:0 40px 100px -30px #7c5cffaa;animation:pop .3s both}
  .vhead{display:flex;align-items:center;gap:12px}
  .vhead h2{flex:1;min-width:0;font-family:var(--head);font-size:1.15rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vhead small{display:block;font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--faint)}
  .vclose,.varrow{background:#ffffff0d;border:1px solid var(--line);cursor:pointer;border-radius:12px;transition:background .2s}
  .vclose:hover,.varrow:hover{background:#ffffff1f}
  .vclose{width:38px;height:38px;font-size:1rem;flex:none}
  .stagewrap{display:flex;align-items:center;gap:10px;min-height:0}
  .varrow{width:42px;height:42px;font-size:1.4rem;flex:none}
  .stage{flex:1;aspect-ratio:16/9;max-height:62vh;border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center;position:relative}
  .stage iframe,.stage img{width:100%;height:100%;border:0;object-fit:contain;background:#000}
  .stage img{position:absolute;inset:0;background:#0b0a15}
  .stage .soon{text-align:center;color:var(--dim);padding:20px}
  .stage .soon b{display:block;font-size:2.4rem;margin-bottom:8px}
  .stage .soon a{color:var(--b)}
  .thumbs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  .thumb{flex:none;width:164px;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;cursor:pointer;background:#ffffff05;border:1px solid var(--line);border-radius:12px;padding:6px;color:var(--dim);transition:all .2s}
  .thumb:hover{color:var(--text);border-color:var(--line2)}
  .thumb .ti{aspect-ratio:16/9;border-radius:8px;background:#000 center/cover no-repeat;display:grid;place-items:center;font-size:1.3rem;margin-bottom:6px}
  .thumb .tt{font-size:.78rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 2px 2px}
  .thumb.on{color:var(--text);border-color:var(--a);background:#7c5cff1f;box-shadow:0 0 0 1px var(--a)}
  .vfoot{display:flex;justify-content:space-between;color:var(--faint);font-size:.82rem}
  .vfoot a{color:var(--b);text-decoration:none}
  .single .thumbs,.single .varrow{display:none}

  @media(max-width:820px){
    .hero{grid-template-columns:1fr;padding:44px 0 36px;gap:0}
    .atomwrap{display:none}
    .stats{gap:24px}
  }
  @media(max-width:600px){.search{width:100%}.tile{min-height:0}.tile .body{margin-top:0}.varrow{display:none}.thumb{width:132px}.vbox{padding:14px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="spot"></div>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#top"><i id="brandLetter">A</i><span id="brandName">Arham</span></a>
    <nav class="iconlinks" id="iconlinks"></nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <div>
      <div class="avatar" id="avatar"><span id="avatarInner">A</span></div>
      <div class="hello">Hi there, I'm</div>
      <h1><span class="grad">Arham</span></h1>
      <div class="role" id="role"></div>
      <p class="bio" id="bio"></p>
      <div class="cta" id="cta"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="atomwrap" aria-hidden="true">
      <svg class="atom" id="atom" viewBox="-120 -120 240 240">
        <defs>
          <radialGradient id="nuc"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
        </defs>
        <g transform="rotate(0)">
          <ellipse rx="104" ry="38" stroke="#22d3ee55"/>
          <circle r="5" fill="#22d3ee"><animateMotion dur="3.2s" repeatCount="indefinite" path="M104,0 A104,38 0 1,1 -104,0 A104,38 0 1,1 104,0"/></circle>
        </g>
        <g transform="rotate(60)">
          <ellipse rx="104" ry="38" stroke="#7c5cff66"/>
          <circle r="5" fill="#a78bfa"><animateMotion dur="4.1s" begin="-1s" repeatCount="indefinite" path="M104,0 A104,38 0 1,1 -104,0 A104,38 0 1,1 104,0"/></circle>
        </g>
        <g transform="rotate(120)">
          <ellipse rx="104" ry="38" stroke="#f472d055"/>
          <circle r="5" fill="#f472d0"><animateMotion dur="3.7s" begin="-2s" repeatCount="indefinite" path="M104,0 A104,38 0 1,1 -104,0 A104,38 0 1,1 104,0"/></circle>
        </g>
        <circle r="26" fill="url(#nuc)"/>
      </svg>
    </div>
  </section>

  <section id="explore">
    <nav class="crumbs" id="crumbs"></nav>
    <div class="bar">
      <div>
        <div class="eyebrow" id="eyebrow">My work</div>
        <h2 class="title" id="label">Explore</h2>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search videos, projects, notes…" autocomplete="off" aria-label="Search">
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <div class="note" id="note" hidden></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="copy"></span>
    <a href="#top">Back to top ↑</a>
  </div>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div class="vbox" id="vbox">
    <div class="vhead"><h2 id="vtitle"></h2><button class="vclose" id="vclose" aria-label="Close">✕</button></div>
    <div class="stagewrap">
      <button class="varrow" id="vprev" aria-label="Previous">‹</button>
      <div class="stage" id="stage"></div>
      <button class="varrow" id="vnext" aria-label="Next">›</button>
    </div>
    <div class="thumbs" id="tabs"></div>
    <div class="vfoot"><span id="vcount"></span><a id="vopen" target="_blank" rel="noopener">Open in new tab ↗</a></div>
  </div>
</div>

<script>
/* ============================================================
   EDIT HERE
   ------------------------------------------------------------
   PROFILE: your name bits, bio and chips at the top of the page.
   SITE:    the menu tree.
     items:[...]  -> a button that opens a submenu
     url:"..."    -> a normal link
     slides:[...] -> opens a popup with several tabs (certificates / videos)
        each slide = { title:"...", url:"..." }
        url can be a YouTube video link, a YouTube playlist link,
        an image (.png/.jpg), a PDF, or any other page link.
        Empty url = shows "coming soon" in that tab.
   ============================================================ */
const PROFILE = {
  letter: "A",
  photo: "",   // optional: path/URL of a photo, e.g. "me.jpg"
  roles: ["Quantum computing explorer", "Builder of hardware projects", "Maker of videos & podcasts", "Always curious"],
  bio: "I'm Arham, a student who loves figuring out how things work, from qubits to Kindles. " +
       "I learn quantum computing through MITx Pro and LinkedIn courses, tinker with hardware, " +
       "and share what I discover through videos, podcasts and notes. This is my corner of the internet where it all lives.",
  links: [
    { name:"GitHub",   icon:"🐙", url:"https://github.com/ArhamAkhtarAlam" },
    { name:"YouTube",  icon:"▶️", url:"https://www.youtube.com/@Thelearninglouge" },
    { name:"LinkedIn", icon:"💼", url:"https://www.linkedin.com/in/arham111/" },
  ],
  chips: ["⚛️ Quantum", "🔧 Hardware", "🎬 Videos", "📚 Always learning"],
};


/* ---- YouTube: Arham's learning lounge (youtube.com/@Thelearninglouge) ---- */
const CHANNEL = "https://www.youtube.com/@Thelearninglouge";
const V4 = [
  { title:"The southern plateau", url:"https://www.youtube.com/watch?v=uk6XstngXLE" },
  { title:"Coastal plains of India", url:"https://www.youtube.com/watch?v=4F814g97hsc" },
  { title:"Geography of Karnataka", url:"https://www.youtube.com/watch?v=BbwGTObfJpc" },
];
const V5 = [
  { title:"Freedom at last", url:"https://www.youtube.com/watch?v=WBb5p4xkO54" },
  { title:"The struggle for independence", url:"https://www.youtube.com/watch?v=NU3LDlSDgf4" },

const iconFor = (l) => ICONS[l.name] || `<span>${l.icon || "🔗"}</span>`;
const ytId = (url) => { const m = (url || "").match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/); return m && m[1]; };
const isImg = (url) => /\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(url || "");
const thumb = (url, q = "hqdefault") => { const id = ytId(url); return id ? `https://i.ytimg.com/vi/${id}/${q}.jpg` : isImg(url) ? url : null; };
const make = (tag, props = {}) => Object.assign(document.createElement(tag), props);

// visit every node: fn(node, pathIndices, trailNames)
function walk(list, fn, p = [], trail = []){
  list.forEach((n, i) => {
    const np = [...p, i];
    fn(n, np, trail);
    if (n.items) walk(n.items, fn, np, [...trail, n.name]);
  });
}

// search index: every menu/link plus every single video
const INDEX = [];
(function buildIndex(){
  const seen = new Set();
  walk(SITE, (n, p, trail) => {
    INDEX.push({ item:n, p, trail });
    (n.noIndex ? [] : n.slides || []).forEach(s => {
      const key = s.url || (n.name + s.title);
      if (!s.url || seen.has(key)) return;
      seen.add(key);
      INDEX.push({ item:{ name:s.title, icon:isImg(s.url) ? "🎓" : "▶️", label:n.label, slides:[s] }, p, trail:[...trail, n.name] });
    });
  });
})();

function makeTile(item, { hue, trail, onMenu, delay }){
  const isMenu = !!item.items, isSlides = !!item.slides, isEmpty = !isMenu && !isSlides && !item.url;
  const el = make(isMenu || isSlides || isEmpty ? "button" : "a", { className:"tile" + (isEmpty ? " empty" : "") });
  el.style.setProperty("--h", hue);
  el.style.animationDelay = delay + "ms";

  const n = isMenu ? item.items.length : isSlides ? item.slides.length : 0;
  const first = isSlides && item.slides.find(s => ytId(s.url) || isImg(s.url));
  const cover = first && thumb(first.thumb || first.url);
  const isVid = first && !!ytId(first.url);
  const word = item.label || (isVid ? "video" : "image");
  const meta = isMenu ? `${n} item${n > 1 ? "s" : ""}`
             : isSlides ? (cover ? `${n} video${n > 1 ? "s" : ""}` : `${n} slide${n > 1 ? "s" : ""}`)
             : (item.meta || (item.url ? new URL(item.url).hostname.replace(/^www\./, "") : ""));
  const arrow = isEmpty ? '<span class="soonpill">Coming soon</span>'
              : `<span class="arrow">${isMenu ? "→" : isSlides ? (cover && !isVid ? "⤢" : "▶") : "↗"}</span>`;
  const trailHtml = trail && trail.length ? `<div class="crumb-trail"></div>` : "";

  el.innerHTML = cover
    ? `<div class="cover${isVid ? "" : " still"}" style="background-image:url('${cover}')"><span class="play">${isVid ? "▶" : "⤢"}</span><span class="count">${n > 1 ? `${n} ${word}s` : isVid ? "Watch" : "View"}</span></div>
       <div class="body"><div>${trailHtml}<div class="name"></div><div class="meta">${isVid ? (n > 1 ? "Playlist" : "Video") : (n > 1 ? "Gallery" : "Image")}</div></div>${arrow}</div>`
    : `<div class="top"><div class="badge${item.logo ? " logo" : ""}">${item.logo ? `<img src="${item.logo}" alt="">` : (item.icon || "✨")}</div>${arrow}</div>
       <div class="body"><div>${trailHtml}<div class="name"></div><div class="meta"></div></div></div>`;
  el.querySelector(".name").textContent = item.name;
  if (!cover) el.querySelector(".meta").textContent = meta;
  if (trailHtml) el.querySelector(".crumb-trail").textContent = trail.join(" › ");

  el.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", (e.clientX - r.left) + "px");
    el.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
  if (isMenu) el.onclick = onMenu;
  else if (isSlides) el.onclick = () => openViewer(item, trail);
  else if (item.url){ el.href = item.url; el.target = "_blank"; el.rel = "noopener"; }
  else el.disabled = true;
  return el;
}

    noteEl.hidden = true;
    const hits = INDEX.filter(({ item }) =>
      (item.name + " " + (item.meta || "")).toLowerCase().includes(q)).slice(0, 60);
    if (!hits.length) grid.append(make("div", { className:"noresults", textContent:"Nothing found. Try another word!" }));
    hits.forEach(({ item, p, trail }, i) => grid.append(makeTile(item, {
      hue: HUES[p[0] % HUES.length], trail, delay: Math.min(i, 12) * 30,
      onMenu: () => go(p),
    })));
    return;
  }

  const { node, list } = nodeAt(path);
  if (path.length){
    crumbs.append(make("button", { className:"back", textContent:"← Back", onclick:() => go(path.slice(0, -1)) }));
    crumbs.append(make("button", { textContent:"Home", onclick:() => go([]) }));
    for (let d = 1; d <= path.length; d++){
      crumbs.append(make("span", { className:"sep", textContent:"›" }));
      const n = nodeAt(path.slice(0, d)).node;
      if (d === path.length) crumbs.append(make("span", { className:"here", textContent:n.name }));
      else crumbs.append(make("button", { textContent:n.name, onclick:() => go(path.slice(0, d)) }));
    }
  }
  eyebrowEl.textContent = path.length ? (path.length > 1 ? nodeAt(path.slice(0, -1)).node.name : "My work") : "My work";
  labelEl.textContent = node ? `${node.icon || ""} ${node.name}`.trim() : "Explore";

  list.forEach((item, i) => grid.append(makeTile(item, {
    hue: HUES[(path.length ? path[0] : i) % HUES.length], delay: i * 45,
    onMenu: () => go([...path, i]),
  })));

  noteEl.hidden = !(node && node.note);
  if (node && node.note) noteEl.textContent = "ℹ️ " + node.note;
}
searchEl.addEventListener("input", render);
render();

/* ============================ slide viewer ============================ */
const viewer = document.getElementById("viewer"), vbox = document.getElementById("vbox"), stage = document.getElementById("stage"),
      tabsEl = document.getElementById("tabs"), vopen = document.getElementById("vopen");
let cur = null, idx = 0, lastFocus = null;

// turn a url into something embeddable
function toEmbed(url){
  if (!url) return null;
  let m;
  if ((m = url.match(/[?&]list=([\w-]+)/)) && !/[?&]v=/.test(url))
    return { kind:"frame", src:`https://www.youtube.com/embed/videoseries?list=${m[1]}` };
  if ((m = url.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/)) || (m = url.match(/^([\w-]{11})$/)))
    return { kind:"frame", src:`https://www.youtube.com/embed/${m[1]}?rel=0` };
  if (/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(url)) return { kind:"img", src:url };
  if (/\.pdf(\?|$)/i.test(url)) return { kind:"frame", src:url };
  return { kind:"link", src:url };
}

function showSlide(i){
  const n = cur.slides.length;
  idx = (i + n) % n;
  const s = cur.slides[idx];
  [...tabsEl.children].forEach((t, k) => t.classList.toggle("on", k === idx));
  tabsEl.children[idx].scrollIntoView({ block:"nearest", inline:"center", behavior:"smooth" });
  document.getElementById("vcount").textContent = n > 1 ? `${idx + 1} of ${n} · ${s.title || ""}` : (s.title || "");
  stage.innerHTML = "";
  const e = toEmbed(s.url);
  vopen.hidden = !s.url; vopen.href = s.url || "#";
  if (!e){
    stage.innerHTML = '<div class="soon"><b>⏳</b>Coming soon</div>';
  } else if (e.kind === "img"){
    stage.append(make("img", { src:e.src, alt:s.title }));
  } else if (e.kind === "frame"){
    const f = make("iframe", { src:e.src, title:s.title, allowFullscreen:true });
    f.referrerPolicy = "strict-origin-when-cross-origin";   // YouTube needs a referrer (Error 153)
    f.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen";
    stage.append(f);
  } else {
    const d = make("div", { className:"soon" });
    d.innerHTML = '<b>🔗</b>This one opens on its own page.<br><a target="_blank" rel="noopener">Open it ↗</a>';
    d.querySelector("a").href = e.src; stage.append(d);
  }
}

function openViewer(item, trail){
  cur = item; lastFocus = document.activeElement;
  const h = document.getElementById("vtitle");
  h.textContent = `${item.icon || ""} ${item.name}`.trim();
  const sub = trail && trail.length ? trail.join(" › ") : nodeAt(path).node?.name;
  if (sub) h.append(make("small", { textContent:sub }));
  tabsEl.innerHTML = "";
  item.slides.forEach((s, k) => {
    const t = make("button", { className:"thumb", onclick:() => showSlide(k) });
    const ti = make("div", { className:"ti" });
    const th = s.thumb || thumb(s.url, "mqdefault");
    if (th) ti.style.backgroundImage = `url('${th}')`; else ti.textContent = s.url ? "🔗" : "⏳";
    t.append(ti, make("div", { className:"tt", textContent:s.title || `Slide ${k + 1}` }));
    tabsEl.append(t);
  });
  vbox.classList.toggle("single", item.slides.length < 2);
  viewer.classList.add("open");
  document.body.style.overflow = "hidden";
  showSlide(0);
  document.getElementById("vclose").focus();
}
function closeViewer(){
  viewer.classList.remove("open");
  stage.innerHTML = "";          // stops any playing video
  document.body.style.overflow = "";
  lastFocus?.focus?.();
}
document.getElementById("vclose").onclick = closeViewer;
document.getElementById("vprev").onclick = () => showSlide(idx - 1);
document.getElementById("vnext").onclick = () => showSlide(idx + 1);
viewer.addEventListener("click", e => { if (e.target === viewer) closeViewer(); });
addEventListener("keydown", e => {
  if (!viewer.classList.contains("open")){
    if (e.key === "/" && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
    return;
  }
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft") showSlide(idx - 1);
  if (e.key === "ArrowRight") showSlide(idx + 1);
});
</script>
